project_id = "barbearia-saas"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://127.0.0.1:5173"]
enable_signup = true

[storage]
enabled = true
file_size_limit = "10MiB"

[functions.whatsapp]
verify_jwt = false
# A função valida JWT via Auth nos endpoints de usuário, assinatura HMAC no webhook
# e segredo exclusivo no dispatcher. O webhook da Meta não envia JWT Supabase.
